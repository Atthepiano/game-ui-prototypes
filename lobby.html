<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ProjectM — 游戏大厅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #020617; }
    #viewport {
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      position: absolute;
      top: 0; left: 0;
    }
  </style>
</head>
<body>
<div id="viewport">
  <div class="w-[1920px] h-[1080px] relative bg-[#020617] overflow-hidden">
    <img class="absolute inset-0 w-full h-full opacity-20 object-cover" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop" alt="bg" />

    <div class="w-full h-full flex flex-col items-center justify-between py-[60px] relative z-10">

      <div class="flex flex-col items-center">
        <span class="text-[72px] font-black text-cyan-400 tracking-[0.2em] drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]">PROJECT M</span>
        <div class="w-[480px] h-[2px] bg-cyan-500 mt-3 opacity-50"></div>
      </div>

      <div class="flex flex-col gap-6">
        <button class="w-[400px] h-[72px] bg-slate-900/80 border-l-4 border-cyan-500 border-r border-y border-cyan-500/20 flex items-center justify-center hover:bg-cyan-900/40 hover:border-cyan-400 transition-all group cursor-pointer">
          <span class="text-cyan-100 text-[24px] font-bold tracking-[0.15em] group-hover:text-white">创建房间</span>
        </button>
        <button class="w-[400px] h-[72px] bg-slate-900/80 border-l-4 border-cyan-500 border-r border-y border-cyan-500/20 flex items-center justify-center hover:bg-cyan-900/40 hover:border-cyan-400 transition-all group cursor-pointer">
          <span class="text-cyan-100 text-[24px] font-bold tracking-[0.15em] group-hover:text-white">英雄预览</span>
        </button>
        <button class="w-[400px] h-[72px] bg-slate-900/80 border-l-4 border-cyan-500 border-r border-y border-cyan-500/20 flex items-center justify-center hover:bg-cyan-900/40 hover:border-cyan-400 transition-all group cursor-pointer">
          <span class="text-cyan-100 text-[24px] font-bold tracking-[0.15em] group-hover:text-white">设置</span>
        </button>
        <button class="w-[400px] h-[72px] bg-slate-900/80 border-l-4 border-red-500 border-r border-y border-red-500/20 flex items-center justify-center hover:bg-red-900/40 hover:border-red-400 transition-all group cursor-pointer">
          <span class="text-red-100 text-[24px] font-bold tracking-[0.15em] group-hover:text-white">退出游戏</span>
        </button>
      </div>

      <div class="w-full px-[60px] flex justify-between items-end">
        <div class="flex flex-col">
          <span class="text-cyan-500/50 text-[13px] uppercase tracking-tight">System Status: Online</span>
          <span class="text-cyan-500/50 text-[13px] uppercase tracking-tight">Connection: Secure</span>
        </div>
        <span class="text-slate-500 font-mono text-[16px]">v1.0.0</span>
      </div>

    </div>

    <img class="absolute top-0 left-0 w-[128px] h-[128px] opacity-30" src="https://www.svgrepo.com/show/445133/corner-top-left.svg" alt="" />
    <img class="absolute bottom-0 right-0 w-[128px] h-[128px] opacity-30 rotate-180" src="https://www.svgrepo.com/show/445133/corner-top-left.svg" alt="" />
  </div>
</div>

<script>
  function fitViewport() {
    var vp = document.getElementById('viewport');
    var sw = window.innerWidth / 1920;
    var sh = window.innerHeight / 1080;
    var s = Math.min(sw, sh);
    vp.style.transform = 'scale(' + s + ')';
    document.body.style.width = window.innerWidth + 'px';
    document.body.style.height = window.innerHeight + 'px';
  }
  fitViewport();
  window.addEventListener('resize', fitViewport);
</script>
</body>
</html>
