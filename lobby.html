<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectM — 游戏大厅</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 overflow-hidden">
<div class="w-full h-screen relative bg-[#020617] overflow-hidden">
  <img class="absolute inset-0 w-full h-full opacity-20 object-cover" src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop" alt="bg-pattern" />

  <div class="w-full h-full flex flex-col items-center justify-between py-12 relative z-10">

    <div class="flex flex-row justify-center flex-none">
      <div class="flex flex-col items-center">
        <span class="text-6xl font-black text-cyan-400 tracking-[0.2em] drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]">PROJECT M</span>
        <div class="min-w-96 h-[2px] bg-cyan-500 mt-2 opacity-50"></div>
      </div>
    </div>

    <div class="flex flex-col gap-5 flex-none">
      <button class="min-w-80 min-h-16 flex-none bg-slate-900/80 border-l-4 border-cyan-500 border-r border-y border-cyan-500/20 flex flex-col items-center justify-center hover:bg-cyan-900/40 hover:border-cyan-400 transition-all group cursor-pointer">
        <span class="text-cyan-100 text-xl font-bold tracking-widest group-hover:text-white">创建房间</span>
      </button>

      <button class="min-w-80 min-h-16 flex-none bg-slate-900/80 border-l-4 border-cyan-500 border-r border-y border-cyan-500/20 flex flex-col items-center justify-center hover:bg-cyan-900/40 hover:border-cyan-400 transition-all group cursor-pointer">
        <span class="text-cyan-100 text-xl font-bold tracking-widest group-hover:text-white">英雄预览</span>
      </button>

      <button class="min-w-80 min-h-16 flex-none bg-slate-900/80 border-l-4 border-cyan-500 border-r border-y border-cyan-500/20 flex flex-col items-center justify-center hover:bg-cyan-900/40 hover:border-cyan-400 transition-all group cursor-pointer">
        <span class="text-cyan-100 text-xl font-bold tracking-widest group-hover:text-white">设置</span>
      </button>

      <button class="min-w-80 min-h-16 flex-none bg-slate-900/80 border-l-4 border-red-500 border-r border-y border-red-500/20 flex flex-col items-center justify-center hover:bg-red-900/40 hover:border-red-400 transition-all group cursor-pointer">
        <span class="text-red-100 text-xl font-bold tracking-widest group-hover:text-white">退出游戏</span>
      </button>
    </div>

    <div class="w-full px-12 flex flex-row justify-between items-end flex-none">
      <div class="flex flex-col">
        <span class="text-cyan-500/50 text-xs uppercase tracking-tighter">System Status: Online</span>
        <span class="text-cyan-500/50 text-xs uppercase tracking-tighter">Connection: Secure</span>
      </div>
      <span class="text-slate-500 font-mono text-sm">v1.0.0</span>
    </div>

  </div>

  <img class="absolute top-0 left-0 min-w-32 min-h-32 opacity-30" src="https://www.svgrepo.com/show/445133/corner-top-left.svg" alt="corner" />
  <img class="absolute bottom-0 right-0 min-w-32 min-h-32 opacity-30 rotate-180" src="https://www.svgrepo.com/show/445133/corner-top-left.svg" alt="corner" />
</div>
</body>
</html>
